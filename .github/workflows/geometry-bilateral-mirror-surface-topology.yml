name: Geometry bilateral mirror-surface topology evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  geometry-bilateral-mirror-surface-topology:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Geometry head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
          fetch-depth: 0
      - name: Prove exact bilateral Rigging ancestry
        working-directory: animal
        run: git merge-base --is-ancestor 94bc573e2e06ba7a35c9908c141e2f939d4739a8 HEAD
      - name: Checkout pinned UC topology observer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: b434a349cf159b392148b4dc9d68146573531a60
          path: uc
      - name: Checkout exact Rigging plan donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact donor checkouts
        run: |
          test "$(git -C uc rev-parse HEAD)" = "b434a349cf159b392148b4dc9d68146573531a60"
          test "$(git -C rig-donor rev-parse HEAD)" = "04760112deb81a8d145226fe7ee02923107c9916"
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full inherited Animal test suite
        working-directory: animal
        env:
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
        run: python -m unittest discover -s tests -v
      - name: Build exact mirror-surface Geometry evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src:../uc/src
        run: |
          mkdir -p evidence/geometry-bilateral-mirror-surface-topology-001
          python tools/build_bilateral_mirror_surface_topology_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --geometry-head "$(git rev-parse HEAD)" \
            --rigging-head 94bc573e2e06ba7a35c9908c141e2f939d4739a8 \
            --uc-head b434a349cf159b392148b4dc9d68146573531a60 \
            --out evidence/geometry-bilateral-mirror-surface-topology-001
          grep -q 'PASS_BILATERAL_EXACT_MIRROR_SURFACE_TOPOLOGY_REPAIR' \
            evidence/geometry-bilateral-mirror-surface-topology-001/bilateral-mirror-surface-topology-receipt.json
          grep -q 'CLOSED_ORIENTED_EDGE_MANIFOLD_CANDIDATE' \
            evidence/geometry-bilateral-mirror-surface-topology-001/bilateral-mirror-surface-topology-receipt.json
          git rev-parse HEAD > evidence/geometry-bilateral-mirror-surface-topology-001/exact-head.txt
          printf '%s\n' '94bc573e2e06ba7a35c9908c141e2f939d4739a8' > evidence/geometry-bilateral-mirror-surface-topology-001/rigging-bilateral-head.txt
          printf '%s\n' 'b434a349cf159b392148b4dc9d68146573531a60' > evidence/geometry-bilateral-mirror-surface-topology-001/uc-topology-donor-head.txt
      - name: Upload exact mirror-surface Geometry evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-geometry-bilateral-mirror-surface-topology-001-evidence
          path: animal/evidence/geometry-bilateral-mirror-surface-topology-001
          if-no-files-found: error
          retention-days: 30
