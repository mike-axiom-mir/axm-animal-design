name: Materials deformed explicit-normal review

on:
  pull_request:
  workflow_dispatch:

jobs:
  materials-deformed-explicit-normal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Materials posed-review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
          fetch-depth: 0

      - name: Prove exact Rigging, Materials, normal and topology ancestry
        working-directory: animal
        run: |
          git merge-base --is-ancestor 91e2fd01be63df807c035b39f7ec824a4a5a60b8 HEAD
          git merge-base --is-ancestor a2cd0a6135a7c8502aef9572f7079a3dd2632103 HEAD
          git merge-base --is-ancestor 79e1667f6cc91e2ec8e41f01df18b6933c9c876d HEAD
          git merge-base --is-ancestor bdbb51303bd1b96866b06a71730ccc328bf4f2f6 HEAD
          test "$(git hash-object src/axm_animal_design/bilateral_deformed_logical_quad_normals.py)" = "b8df083310727dcd05e7476b2158a081a5c25c8f"
          test "$(git hash-object src/axm_animal_design/bilateral_logical_quad_normals.py)" = "14a1ba3a1e4c96270197f4f449505113f7bf3e6e"
          test "$(git hash-object src/axm_animal_design/bilateral_mirror_surface_topology.py)" = "9a0ebcc6169445996756bb446a87e3baf8b9cc33"

      - name: Checkout exact Rigging plan and weighting-profile donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor

      - name: Verify exact Rigging donor checkout
        run: test "$(git -C rig-donor rev-parse HEAD)" = "04760112deb81a8d145226fe7ee02923107c9916"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools

      - name: Run full inherited Animal suite
        working-directory: animal
        env:
          PYTHONPATH: src
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
          AXM_WEIGHTING_PROFILE: ../rig-donor/examples/quadruped_weighting_refinement_001.json
        run: python -m unittest discover -s tests -v

      - name: Install image verifier dependency
        if: matrix.python-version == '3.11'
        run: python -m pip install --disable-pip-version-check pillow

      - name: Setup Godot target host
        if: matrix.python-version == '3.11'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Build exact representative posed review payload
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          rm -rf evidence/materials-deformed-explicit-normal-review-001
          mkdir -p evidence/materials-deformed-explicit-normal-review-001/renders
          python tools/build_bilateral_deformed_explicit_normal_review_payload.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --rigging-head 91e2fd01be63df807c035b39f7ec824a4a5a60b8 \
            --rigging-module-blob b8df083310727dcd05e7476b2158a081a5c25c8f \
            --normal-head 79e1667f6cc91e2ec8e41f01df18b6933c9c876d \
            --normal-module-blob 14a1ba3a1e4c96270197f4f449505113f7bf3e6e \
            --topology-head bdbb51303bd1b96866b06a71730ccc328bf4f2f6 \
            --topology-module-blob 9a0ebcc6169445996756bb446a87e3baf8b9cc33 \
            --out evidence/materials-deformed-explicit-normal-review-001/review-payload.json

      - name: Validate Godot posed review project
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: godot --headless --path evidence/godot_bilateral_deformed_normal_review --editor --quit

      - name: Capture exact target-host posed review
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: |
          set -euo pipefail
          timeout 240s xvfb-run --auto-servernum --server-args="-screen 0 960x720x24" \
            godot \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path evidence/godot_bilateral_deformed_normal_review -- \
            --payload "$(pwd)/evidence/materials-deformed-explicit-normal-review-001/review-payload.json" \
            --out-dir "$(pwd)/evidence/materials-deformed-explicit-normal-review-001/renders" \
            --rigging-head 91e2fd01be63df807c035b39f7ec824a4a5a60b8 \
            --rigging-module-blob b8df083310727dcd05e7476b2158a081a5c25c8f \
            --normal-head 79e1667f6cc91e2ec8e41f01df18b6933c9c876d \
            --normal-module-blob 14a1ba3a1e4c96270197f4f449505113f7bf3e6e \
            --topology-head bdbb51303bd1b96866b06a71730ccc328bf4f2f6 \
            --topology-module-blob 9a0ebcc6169445996756bb446a87e3baf8b9cc33

      - name: Verify and summarize posed target-host evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: |
          python tools/verify_bilateral_deformed_explicit_normal_review.py \
            --payload evidence/materials-deformed-explicit-normal-review-001/review-payload.json \
            --telemetry evidence/materials-deformed-explicit-normal-review-001/target-host-telemetry.json \
            --renders evidence/materials-deformed-explicit-normal-review-001/renders \
            --materials-head "$(git rev-parse HEAD)" \
            --out evidence/materials-deformed-explicit-normal-review-001/material-lookdev-evidence.json
          grep -q 'PASS_TARGET_HOST_DEFORMED_EXPLICIT_NORMAL_REVIEW_CAPTURED' \
            evidence/materials-deformed-explicit-normal-review-001/material-lookdev-evidence.json
          git rev-parse HEAD > evidence/materials-deformed-explicit-normal-review-001/exact-materials-head.txt
          printf '%s\n' '91e2fd01be63df807c035b39f7ec824a4a5a60b8' > evidence/materials-deformed-explicit-normal-review-001/exact-rigging-head.txt
          printf '%s\n' 'b8df083310727dcd05e7476b2158a081a5c25c8f' > evidence/materials-deformed-explicit-normal-review-001/exact-rigging-module-blob.txt
          printf '%s\n' '79e1667f6cc91e2ec8e41f01df18b6933c9c876d' > evidence/materials-deformed-explicit-normal-review-001/exact-normal-head.txt
          printf '%s\n' 'bdbb51303bd1b96866b06a71730ccc328bf4f2f6' > evidence/materials-deformed-explicit-normal-review-001/exact-topology-head.txt
          cat > evidence/materials-deformed-explicit-normal-review-001/README.txt <<'EOF'
          Materials / LookDev representative deformed-shading evidence only.
          This renders the exact PR #18 representative right-elbow poses for both established weighting profiles at -60/-30/0/+30/+60 degrees, in two fixed camera contexts, comparing historical versus exact-mirror topology under triangle-generated and explicit logical-quad normals.
          Source positions per pose, triangle budget, neutral probe material, lighting and cameras are held. Bilateral pose/normal provenance is retained from the exact Rigging prerequisite.
          Tangents remain NOT_DEFINED_NO_UV_BASIS. No production Animal material, continuous-envelope visual proof, production skin-normal transport, final Art/QA acceptance, Runtime acceptance, CANON or production readiness is claimed.
          EOF

      - name: Upload exact Materials posed normal review evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-materials-deformed-explicit-normal-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal/evidence/materials-deformed-explicit-normal-review-001
          if-no-files-found: error
          retention-days: 30
