name: UC bilateral source-successor surface bridge evidence

on:
  pull_request:

jobs:
  bilateral-source-successor-current-uc-surface-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout exact bilateral Geometry producer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: f89af95d621c36da3994c6660552da8bbc73fd1b
          path: .animal-geometry-bilateral
      - name: Checkout exact UC topology observer required by Geometry producer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: b434a349cf159b392148b4dc9d68146573531a60
          path: .uc-topology-donor
      - name: Checkout previous proven UC surface pin
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 2595788885faca5fbe69e1497b55d535aff51259
          path: .uc-surface-previous
      - name: Checkout current Universal Creation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ecef151548736628cff62652a36be6eb1c7b1ad6
          path: .uc-bilateral-surface-current
      - name: Compile Technical Art bridge and run existing bridge unit tests
        run: |
          python -m compileall -q src tests tools/build_uc_bilateral_source_successor_surface_bridge_evidence.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_uc_bridge.py' -v
      - name: Regenerate exact bilateral source-successor candidates through Geometry owner
        run: |
          mkdir -p evidence/uc_bilateral_source_successor_surface/producer
          PYTHONPATH=.animal-geometry-bilateral/src:.uc-topology-donor/src \
            python .animal-geometry-bilateral/tools/build_bilateral_source_successor_topology_rebind_evidence.py \
              --source .animal-geometry-bilateral/examples/quadruped_neutral_001.json \
              --left-profile .animal-geometry-bilateral/examples/quadruped_elbow_source_successor_003.json \
              --bilateral-profile .animal-geometry-bilateral/examples/quadruped_elbow_bilateral_successor_003.json \
              --out evidence/uc_bilateral_source_successor_surface/producer
      - name: Build exact bilateral Geometry -> current UC -> GLB evidence
        env:
          AXM_ANIMAL_GEOMETRY_COMMIT: f89af95d621c36da3994c6660552da8bbc73fd1b
          AXM_ANIMAL_GEOMETRY_CHECKOUT: ${{ github.workspace }}/.animal-geometry-bilateral
          AXM_GEOMETRY_PRODUCER_EVIDENCE: ${{ github.workspace }}/evidence/uc_bilateral_source_successor_surface/producer
          AXM_PREVIOUS_UC_COMMIT: 2595788885faca5fbe69e1497b55d535aff51259
          AXM_PREVIOUS_UC_CHECKOUT: ${{ github.workspace }}/.uc-surface-previous
          AXM_UC_COMMIT: ecef151548736628cff62652a36be6eb1c7b1ad6
          AXM_UC_CHECKOUT: ${{ github.workspace }}/.uc-bilateral-surface-current
        run: PYTHONPATH=src:.uc-bilateral-surface-current/src python tools/build_uc_bilateral_source_successor_surface_bridge_evidence.py
      - name: Retain exact checkout identities
        run: |
          git rev-parse HEAD > evidence/uc_bilateral_source_successor_surface/technical-art-head.txt
          git -C .animal-geometry-bilateral rev-parse HEAD > evidence/uc_bilateral_source_successor_surface/geometry-head.txt
          git -C .uc-surface-previous rev-parse HEAD > evidence/uc_bilateral_source_successor_surface/previous-uc-head.txt
          git -C .uc-bilateral-surface-current rev-parse HEAD > evidence/uc_bilateral_source_successor_surface/uc-head.txt
          git -C .uc-surface-previous rev-parse HEAD:src/axm_uc/procedural_3d.py > evidence/uc_bilateral_source_successor_surface/previous-uc-procedural-3d-blob.txt
          git -C .uc-bilateral-surface-current rev-parse HEAD:src/axm_uc/procedural_3d.py > evidence/uc_bilateral_source_successor_surface/uc-procedural-3d-blob.txt
          grep -q 'PASS_BILATERAL_SOURCE_SUCCESSOR_GEOMETRY_TO_CURRENT_UC_GLB' evidence/uc_bilateral_source_successor_surface/quadruped_bilateral_selected003_uc_bridge.evidence.json
      - name: Upload exact bilateral static UC bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-bilateral-source-successor-current-uc-surface-bridge-evidence
          path: evidence/uc_bilateral_source_successor_surface/
          if-no-files-found: error
