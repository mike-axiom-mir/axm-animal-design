name: Organic elbow source successor evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  organic-elbow-source-successor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Organic review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
      - name: Checkout exact Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite with exact Rigging donor
        working-directory: animal
        env:
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
        run: python -m unittest discover -s tests -v
      - name: Build exact source-adoption evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/organic-elbow-source-successor-003
          python tools/build_organic_elbow_source_successor_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --profile examples/quadruped_elbow_source_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --art-direction-commit 880b79b6107b0d117f9a7a32f4fb134022cdf67b \
            --visual-qa-commit aac10f46a3ead7a77156bffaedb4cd2ecb058561 \
            --out evidence/organic-elbow-source-successor-003

          test -s evidence/organic-elbow-source-successor-003/source-adoption-receipt.json
          test -s evidence/organic-elbow-source-successor-003/source-successor.json
          test -s evidence/organic-elbow-source-successor-003/selected-review-control.json
          test -s evidence/organic-elbow-source-successor-003/source-successor-structural-overlay.svg
          grep -q 'PASS_SOURCE_OWNED_SELECTED003_EXACT_SHAPE_ADOPTION' \
            evidence/organic-elbow-source-successor-003/source-adoption-receipt.json
          grep -q 'SOURCE_OWNED_SUCCESSOR_NOT_CANON' \
            evidence/organic-elbow-source-successor-003/source-adoption-receipt.json
          git rev-parse HEAD > evidence/organic-elbow-source-successor-003/exact-head.txt
          printf '%s\n' '04760112deb81a8d145226fe7ee02923107c9916' > evidence/organic-elbow-source-successor-003/rig-donor-head.txt
          printf '%s\n' '880b79b6107b0d117f9a7a32f4fb134022cdf67b' > evidence/organic-elbow-source-successor-003/art-direction-commit.txt
          printf '%s\n' 'aac10f46a3ead7a77156bffaedb4cd2ecb058561' > evidence/organic-elbow-source-successor-003/visual-qa-commit.txt
      - name: Upload exact source-adoption evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-organic-elbow-source-successor-003-evidence
          path: animal/evidence/organic-elbow-source-successor-003
          if-no-files-found: error
          retention-days: 30
