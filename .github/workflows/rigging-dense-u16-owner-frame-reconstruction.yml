name: Rigging dense u16 owner-frame reconstruction evidence

on:
  pull_request:
    paths:
      - "tools/build_dense_u16_owner_frame_reconstruction.py"
      - "docs/rigging_dense_u16_owner_frame_reconstruction.md"
      - ".github/workflows/rigging-dense-u16-owner-frame-reconstruction.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dense-u16-owner-frame:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact Rigging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
          fetch-depth: 0

      - name: Preserve exact Rigging lineage
        working-directory: animal
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e4ce8c1f4c3deb55220cf962206d51013d0cfe73 HEAD
          git merge-base --is-ancestor 81ab44eab2e13bed95187610a476be2b2c4667a7 HEAD
          test "$(git hash-object src/axm_animal_design/transported_frame_reconstruction_constraint.py)" = "c9916c62e2081922b8eb7ec0b3cd1c25c019b2f6"

      - name: Checkout exact Animation dense-subframe donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 37f5a77d39d221be796ac3b0c3a179fd3c86a8c0
          path: animation-donor
          fetch-depth: 1

      - name: Verify exact Animation donor
        run: |
          set -euo pipefail
          test "$(git -C animation-donor rev-parse HEAD)" = "37f5a77d39d221be796ac3b0c3a179fd3c86a8c0"
          test "$(git -C animation-donor hash-object tools/build_animation_weight_quantization_subframe_guard.py)" = "fc596bee8eb3739a7a7a4b680daf40a481fbc63d"

      - name: Checkout exact Rigging plan donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
          fetch-depth: 1

      - name: Download exact Runtime and Animation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rigging-dense
          mkdir -p /tmp/rigging-dense/runtime /tmp/rigging-dense/animation

          gh api repos/${{ github.repository }}/actions/artifacts/10477292250/zip > /tmp/rigging-dense/runtime.zip
          echo "76455589e0dde3327f72ebff6a117a2ce12ff57edaaf1d0e61304056d03063c3  /tmp/rigging-dense/runtime.zip" | sha256sum -c -
          unzip -q /tmp/rigging-dense/runtime.zip -d /tmp/rigging-dense/runtime
          test "$(sha256sum /tmp/rigging-dense/runtime/control-f32-weights.glb | awk '{print $1}')" = "8d9bfb80369bda09eaad786a35833cd5e04da5e608211f53648daaa1cde29566"
          test "$(sha256sum /tmp/rigging-dense/runtime/candidate-u16norm-weights.glb | awk '{print $1}')" = "81c5422f8cf13ca65a253d3b05ebcf88fc0b20601dfb466b3c92f0d5e28dafcb"

          gh api repos/${{ github.repository }}/actions/artifacts/10485697941/zip > /tmp/rigging-dense/animation.zip
          echo "496e744f6bd3c8ad3b0648298cceecd7c7170a651f510674a92c957424a954e3  /tmp/rigging-dense/animation.zip" | sha256sum -c -
          unzip -q /tmp/rigging-dense/animation.zip -d /tmp/rigging-dense/animation
          test -f /tmp/rigging-dense/animation/receipt.json
          grep -q '37f5a77d39d221be796ac3b0c3a179fd3c86a8c0' /tmp/rigging-dense/animation/receipt.json
          grep -q 'PASS_U16_WEIGHT_SUBFRAME_TRAJECTORY_WITHIN_RIGGING_BOUND' /tmp/rigging-dense/animation/receipt.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete inherited Animal suite
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v

      - name: Build exact dense u16 post-skin owner-frame evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf evidence/rigging-dense-u16-owner-frame-reconstruction-001
          python tools/build_dense_u16_owner_frame_reconstruction.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --rig-plan "$GITHUB_WORKSPACE/rig-donor/examples/quadruped_rig_probe_001.json" \
            --weighting-profile "$GITHUB_WORKSPACE/rig-donor/examples/quadruped_weighting_refinement_001.json" \
            --control-glb /tmp/rigging-dense/runtime/control-f32-weights.glb \
            --candidate-glb /tmp/rigging-dense/runtime/candidate-u16norm-weights.glb \
            --animation-receipt /tmp/rigging-dense/animation/receipt.json \
            --animation-guard-tool "$GITHUB_WORKSPACE/animation-donor/tools/build_animation_weight_quantization_subframe_guard.py" \
            --current-rigging-head "$(git rev-parse HEAD)" \
            --out evidence/rigging-dense-u16-owner-frame-reconstruction-001

          grep -q 'PASS_DENSE_U16_POST_SKIN_OWNER_FRAME_RECONSTRUCTION_321_SUBFRAMES__STATIC_DIRECTION_TRANSPORT_HOLD_PRESERVED' evidence/rigging-dense-u16-owner-frame-reconstruction-001/receipt.json
          grep -q '"animation_timing_interpolation_playback_accepted_by_rigging": false' evidence/rigging-dense-u16-owner-frame-reconstruction-001/receipt.json
          grep -q '"technical_art_target_runtime_implementation_accepted": false' evidence/rigging-dense-u16-owner-frame-reconstruction-001/receipt.json
          grep -q '"runtime_controller_device_accepted": false' evidence/rigging-dense-u16-owner-frame-reconstruction-001/receipt.json
          grep -q '"reclassified": false' evidence/rigging-dense-u16-owner-frame-reconstruction-001/receipt.json

          cp /tmp/rigging-dense/animation/receipt.json evidence/rigging-dense-u16-owner-frame-reconstruction-001/exact-animation-dense-guard-receipt.json
          cp "$GITHUB_WORKSPACE/rig-donor/examples/quadruped_rig_probe_001.json" evidence/rigging-dense-u16-owner-frame-reconstruction-001/exact-rig-plan.json
          cp "$GITHUB_WORKSPACE/rig-donor/examples/quadruped_weighting_refinement_001.json" evidence/rigging-dense-u16-owner-frame-reconstruction-001/exact-weighting-profile.json

      - name: Upload exact dense Rigging evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-rigging-dense-u16-owner-frame-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal/evidence/rigging-dense-u16-owner-frame-reconstruction-001
          if-no-files-found: error
          retention-days: 30
