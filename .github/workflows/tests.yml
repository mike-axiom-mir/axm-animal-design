name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exact organic-form evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_baseline.py
      - name: Upload organic-form evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-neutral-001-evidence
          path: evidence/
          if-no-files-found: error
      - name: Build exact rig-deformation evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_rig_deformation_probe.py
      - name: Upload rig-deformation evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-rig-probe-001-evidence
          path: |
            evidence/quadruped_rig_probe_001.evidence.json
            evidence/quadruped_rig_probe_001.summary.json
          if-no-files-found: error
      - name: Build exact animation-motion evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_animation_motion.py
      - name: Upload animation-motion evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-articulation-loop-001-evidence
          path: |
            evidence/quadruped_articulation_loop_001.evidence.json
            evidence/quadruped_articulation_loop_001.summary.json
            evidence/quadruped_articulation_loop_001_frames/
          if-no-files-found: error
      - name: Build exact animation temporal-continuity evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_animation_temporal.py
      - name: Upload animation temporal-continuity evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-articulation-loop-001-temporal-evidence
          path: |
            evidence/quadruped_articulation_loop_001.temporal.json
            evidence/quadruped_articulation_loop_001.temporal_summary.json
            evidence/quadruped_articulation_loop_001.temporal_review.svg
          if-no-files-found: error
