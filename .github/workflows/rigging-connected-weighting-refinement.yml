name: Connected topology weighting refinement evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  connected-weighting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact connected Rigging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: animal
      - name: Checkout exact existing Rigging weighting donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove prior connected Rigging evidence remains in ancestry
        working-directory: animal
        run: |
          git merge-base --is-ancestor f4614ab2f691cd5c5d12b88fabc38ef848acd24e HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite
        working-directory: animal
        run: python -m unittest discover -s tests -v
      - name: Reject wrong Rigging donor identity
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          if python tools/build_connected_weighting_refinement_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --rig-donor-head 0000000000000000000000000000000000000000 \
            --out evidence/negative-connected-weighting; then
            echo "wrong Rigging donor unexpectedly passed"
            exit 1
          fi
          rm -rf evidence/negative-connected-weighting
      - name: Build exact connected weighting refinement evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          python tools/build_connected_weighting_refinement_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --rig-donor-head 04760112deb81a8d145226fe7ee02923107c9916 \
            --out evidence/rigging-connected-weighting-001
          git rev-parse HEAD > evidence/rigging-connected-weighting-001/exact-head.txt
          printf '%s\n' 'f4614ab2f691cd5c5d12b88fabc38ef848acd24e' > evidence/rigging-connected-weighting-001/connected-rig-predecessor-head.txt
          printf '%s\n' 'feb4b24cd36bcc879173138d240754f71db34834' > evidence/rigging-connected-weighting-001/geometry-pr4-head.txt
          printf '%s\n' '04760112deb81a8d145226fe7ee02923107c9916' > evidence/rigging-connected-weighting-001/rig-donor-head.txt
      - name: Upload exact evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: front-left-connected-chain-001-weighting-refinement-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal/evidence/rigging-connected-weighting-001
          if-no-files-found: error
          retention-days: 30
