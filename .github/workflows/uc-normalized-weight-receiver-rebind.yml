name: UC normalized skin-weight receiver rebind

on:
  pull_request:
    paths:
      - ".github/workflows/uc-normalized-weight-receiver-rebind.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-u16-candidate-to-merged-uc-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta
          fetch-depth: 0

      - name: Bind exact Technical Art head
        shell: bash
        run: |
          set -euo pipefail
          TA_HEAD="$(git -C animal-ta rev-parse HEAD)"
          echo "TA_HEAD=${TA_HEAD}" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$TA_HEAD" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$TA_HEAD" = "$GITHUB_SHA"
          fi

      - name: Checkout pre-repair UC receiver
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: e768b4810bfa9da09c9b927bb719c363e0494612
          path: uc-old

      - name: Checkout merged UC main receiver
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 9332e3455092cf8b0011fd69607d99a1e82a2dc8
          path: uc-merged

      - name: Verify exact UC identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C uc-old rev-parse HEAD)" = "e768b4810bfa9da09c9b927bb719c363e0494612"
          test "$(git -C uc-old rev-parse HEAD:capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js)" = "b1f2e68bb6c6800af5496decc95a8044d141edc9"
          test "$(git -C uc-merged rev-parse HEAD)" = "9332e3455092cf8b0011fd69607d99a1e82a2dc8"
          test "$(git -C uc-merged rev-parse HEAD:capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js)" = "02b69b6c7368ba6e34f226ca545293d26d208922"

      - name: Download exact Runtime normalized-u16 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          gh api repos/${{ github.repository }}/actions/artifacts/10477292250/zip > /tmp/runtime-weight-width.zip
          test "$(sha256sum /tmp/runtime-weight-width.zip | awk '{print $1}')" = "76455589e0dde3327f72ebff6a117a2ce12ff57edaaf1d0e61304056d03063c3"
          unzip -q /tmp/runtime-weight-width.zip -d runtime-evidence
          CANDIDATE="$(find "$GITHUB_WORKSPACE/runtime-evidence" -name 'candidate-u16norm-weights.glb' -print -quit)"
          CONTROL="$(find "$GITHUB_WORKSPACE/runtime-evidence" -name 'control-f32-weights.glb' -print -quit)"
          test -n "$CANDIDATE" && test -n "$CONTROL"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "81c5422f8cf13ca65a253d3b05ebcf88fc0b20601dfb466b3c92f0d5e28dafcb"
          test "$(stat -c%s "$CANDIDATE")" = "10296"
          test "$(sha256sum "$CONTROL" | awk '{print $1}')" = "8d9bfb80369bda09eaad786a35833cd5e04da5e608211f53648daaa1cde29566"
          grep -R -q 'HOLD_ANIMAL_GLB_WEIGHT_WIDTH_COMPACTION__CURRENT_UC_RIGGED_CODEC_FLOAT_ONLY' runtime-evidence
          echo "AXM_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "AXM_CONTROL=$CONTROL" >> "$GITHUB_ENV"

      - name: Prove old rejection and merged-main receiver acceptance
        shell: bash
        env:
          OLD_CODEC: ${{ github.workspace }}/uc-old/capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js
          NEW_CODEC: ${{ github.workspace }}/uc-merged/capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/animal-ta/evidence/uc_normalized_weight_receiver_rebind"
          rm -rf "$OUT" && mkdir -p "$OUT"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const oldRig = require(process.env.OLD_CODEC);
          const newRig = require(process.env.NEW_CODEC);
          const candidate = fs.readFileSync(process.env.AXM_CANDIDATE);
          const control = fs.readFileSync(process.env.AXM_CONTROL);
          const oldCandidate = oldRig.inspect(candidate);
          const oldControl = oldRig.inspect(control);
          const newCandidate = newRig.inspect(candidate);
          const newControl = newRig.inspect(control);
          if (!oldControl.pass) throw new Error('pre-repair receiver no longer accepts exact FLOAT control: ' + oldControl.errors.join('; '));
          if (oldCandidate.pass || !oldCandidate.errors.includes('WEIGHTS_0 accessor invalid')) throw new Error('pre-repair receiver did not retain exact normalized-u16 HOLD');
          if (!newControl.pass) throw new Error('merged-main receiver regressed FLOAT control: ' + newControl.errors.join('; '));
          if (!newCandidate.pass) throw new Error('merged-main receiver rejected exact normalized-u16 candidate: ' + newCandidate.errors.join('; '));
          if (newCandidate.vertices !== 84 || newCandidate.triangles !== 80) throw new Error('candidate geometry identity changed at receiver');
          if (!newCandidate.skin || newCandidate.skin.joints !== 2) throw new Error('candidate skin joint count changed');
          if (!newCandidate.animation || newCandidate.animation.frames !== 41 || newCandidate.animation.channels !== 1) throw new Error('candidate animation identity changed');
          const primitive = newCandidate.json.meshes[0].primitives[0];
          const weight = newCandidate.json.accessors[primitive.attributes.WEIGHTS_0];
          if (weight.componentType !== 5123 || weight.normalized !== true || weight.type !== 'VEC4') throw new Error('candidate WEIGHTS_0 representation drifted');
          const compact = inspection => ({
            pass: inspection.pass,
            errors: inspection.errors,
            vertices: inspection.vertices,
            triangles: inspection.triangles,
            weightSumsPass: inspection.weightSumsPass,
            jointIndicesPass: inspection.jointIndicesPass,
            skin: inspection.skin,
            animation: inspection.animation,
            deformation: inspection.deformation,
          });
          const receipt = {
            schema: 'axm.animal-uc-normalized-weight-receiver-rebind/v0.2',
            result: 'PASS_EXACT_RUNTIME_U16_WEIGHT_CANDIDATE_TO_MERGED_UC_MAIN_RECEIVER',
            technical_art_head: process.env.TA_HEAD,
            runtime_owner: {
              head: 'e7874c4a8dca1db48bc66f3546c2134f7d724456',
              artifact_id: 10477292250,
              artifact_archive_sha256: '76455589e0dde3327f72ebff6a117a2ce12ff57edaaf1d0e61304056d03063c3',
              candidate_sha256: crypto.createHash('sha256').update(candidate).digest('hex'),
              candidate_bytes: candidate.length,
              weights_component_type: 5123,
              weights_normalized: true,
              measured_visual_hold: { changed_pixels_total: 224, maximum_channel_delta_lsb: 1, acceptance: 'HELD_FOR_ART_DIRECTION_VISUAL_QA' },
            },
            receiver_before: {
              uc_head: 'e768b4810bfa9da09c9b927bb719c363e0494612',
              codec_blob: 'b1f2e68bb6c6800af5496decc95a8044d141edc9',
              control: compact(oldControl),
              candidate: compact(oldCandidate),
            },
            receiver_after: {
              source_pr: 176,
              source_pr_head: 'fbb75738210c676d4d76398bd3c3deb9a6dde920',
              uc_main_merge_head: '9332e3455092cf8b0011fd69607d99a1e82a2dc8',
              codec_blob: '02b69b6c7368ba6e34f226ca545293d26d208922',
              control: compact(newControl),
              candidate: compact(newCandidate),
            },
            holds: [
              'No Technical Art producer weight-width adoption is granted by receiver compatibility.',
              'Runtime owner retains quantizer and measured representation evidence.',
              '224 changed pixels / max 1 LSB remain for Art Direction / Visual QA review.',
              'Known deformed normal/tangent direction-frame HOLD remains active.',
              'No CANON, production readiness, performance gain or broad glTF-format claim.'
            ]
          };
          const out = path.join(process.env.GITHUB_WORKSPACE, 'animal-ta/evidence/uc_normalized_weight_receiver_rebind');
          fs.writeFileSync(path.join(out, 'receiver-rebind-receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'old-uc-inspection.json'), JSON.stringify(compact(oldCandidate), null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'merged-uc-main-inspection.json'), JSON.stringify(compact(newCandidate), null, 2) + '\n');
          NODE
          grep -q 'PASS_EXACT_RUNTIME_U16_WEIGHT_CANDIDATE_TO_MERGED_UC_MAIN_RECEIVER' "$OUT/receiver-rebind-receipt.json"
          cp "$AXM_CANDIDATE" "$OUT/runtime-candidate-u16norm-weights.glb"
          printf '%s\n' "$TA_HEAD" > "$OUT/technical-art-head.txt"
          printf '%s\n' 'e7874c4a8dca1db48bc66f3546c2134f7d724456' > "$OUT/runtime-head.txt"
          printf '%s\n' 'fbb75738210c676d4d76398bd3c3deb9a6dde920' > "$OUT/uc-source-pr-head.txt"
          printf '%s\n' '9332e3455092cf8b0011fd69607d99a1e82a2dc8' > "$OUT/uc-main-merge-head.txt"
          printf '%s\n' '02b69b6c7368ba6e34f226ca545293d26d208922' > "$OUT/uc-codec-blob.txt"

      - name: Upload exact normalized-weight merged-main evidence
        uses: actions/upload-artifact@v4
        with:
          name: animal-uc-normalized-weight-merged-main-rebind-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta/evidence/uc_normalized_weight_receiver_rebind
          if-no-files-found: error
          retention-days: 30
