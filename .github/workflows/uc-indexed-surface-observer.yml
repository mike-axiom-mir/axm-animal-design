name: UC indexed surface observer evidence

on:
  pull_request:
    paths:
      - "tools/build_uc_indexed_surface_observer_evidence.py"
      - ".github/workflows/uc-indexed-surface-observer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-animal-render-domain-to-uc-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta
          fetch-depth: 0

      - name: Bind exact Technical Art head
        shell: bash
        run: |
          set -euo pipefail
          TA_HEAD="$(git -C animal-ta rev-parse HEAD)"
          echo "TA_HEAD=${TA_HEAD}" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "${TA_HEAD}" = "${{ github.event.pull_request.head.sha }}"
          else
            test "${TA_HEAD}" = "${GITHUB_SHA}"
          fi

      - name: Checkout exact Geometry UV/tangent owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: ca4bb8a2f144231f8755eacc980785d1807b79db
          path: geometry

      - name: Checkout exact UC observer PR head
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 3601688dc15fb752fcd51bb536722db2f1267a8f
          path: uc

      - name: Verify exact owner and observer identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C geometry rev-parse HEAD)" = "ca4bb8a2f144231f8755eacc980785d1807b79db"
          test "$(git -C geometry rev-parse HEAD:src/axm_animal_design/bilateral_uv_tangent_basis.py)" = "ba0b4e620f132413606177358e47bd32ae4d4965"
          test "$(git -C uc rev-parse HEAD)" = "3601688dc15fb752fcd51bb536722db2f1267a8f"
          test "$(git -C uc rev-parse HEAD:src/axm_uc/indexed_surface_eligibility.py)" = "2cbcafd21c2d8d44cf53ba67120f35ff5bd06bc5"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild exact Geometry-owned UV/tangent basis
        working-directory: geometry
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/geometry-basis"
          python tools/build_bilateral_uv_tangent_basis_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --parent-head 91e2fd01be63df807c035b39f7ec824a4a5a60b8 \
            --normal-head 79e1667f6cc91e2ec8e41f01df18b6933c9c876d \
            --materials-head a2cd0a6135a7c8502aef9572f7079a3dd2632103 \
            --topology-head bdbb51303bd1b96866b06a71730ccc328bf4f2f6 \
            --normal-module-blob 14a1ba3a1e4c96270197f4f449505113f7bf3e6e \
            --topology-module-blob 9a0ebcc6169445996756bb446a87e3baf8b9cc33 \
            --exact-head "$(git rev-parse HEAD)" \
            --out-dir "$RUNNER_TEMP/geometry-basis"
          grep -q 'PASS_BILATERAL_UV_TANGENT_BASIS_CANDIDATE__FINAL_UV_VISUAL_TRANSPORT_HELD' \
            "$RUNNER_TEMP/geometry-basis/geometry-uv-tangent-evidence.json"

      - name: Prove exact 42-to-84 render domain through UC observer
        working-directory: animal-ta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/uc_indexed_surface_observer
          python tools/build_uc_indexed_surface_observer_evidence.py \
            --geometry-basis "$RUNNER_TEMP/geometry-basis/right-uv-tangent-basis.json" \
            --uc-root "$GITHUB_WORKSPACE/uc" \
            --technical-art-head "$TA_HEAD" \
            --geometry-head ca4bb8a2f144231f8755eacc980785d1807b79db \
            --uc-head 3601688dc15fb752fcd51bb536722db2f1267a8f \
            --uc-observer-blob 2cbcafd21c2d8d44cf53ba67120f35ff5bd06bc5 \
            --out evidence/uc_indexed_surface_observer
          grep -q 'PASS_ANIMAL_EXACT_42_TO_84_RENDER_DOMAIN_PRESERVED_BY_UC_INDEX_ELIGIBILITY_OBSERVER' \
            evidence/uc_indexed_surface_observer/receipt.json
          test "$(cat evidence/uc_indexed_surface_observer/technical-art-head.txt)" = "$TA_HEAD"
          test "$(cat evidence/uc_indexed_surface_observer/geometry-head.txt)" = "ca4bb8a2f144231f8755eacc980785d1807b79db"
          test "$(cat evidence/uc_indexed_surface_observer/uc-head.txt)" = "3601688dc15fb752fcd51bb536722db2f1267a8f"
          test "$(cat evidence/uc_indexed_surface_observer/uc-observer-blob.txt)" = "2cbcafd21c2d8d44cf53ba67120f35ff5bd06bc5"

      - name: Retain exact Geometry owner evidence beside observer evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/geometry-basis/geometry-uv-tangent-evidence.json" animal-ta/evidence/uc_indexed_surface_observer/geometry-owner-receipt.json
          cp "$RUNNER_TEMP/geometry-basis/right-uv-tangent-basis.json" animal-ta/evidence/uc_indexed_surface_observer/geometry-right-basis.json

      - name: Upload exact Animal to UC observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: animal-uc-indexed-surface-observer-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta/evidence/uc_indexed_surface_observer
          if-no-files-found: error
          retention-days: 30
