name: UC rigged animation bridge evidence

on:
  pull_request:
    paths:
      - "src/axm_animal_design/uc_rigged_animation_bridge.py"
      - "tools/build_uc_rigged_animation_bridge_evidence.py"
      - "tests/test_uc_rigged_animation_bridge.py"
      - ".github/workflows/uc-rigged-animation-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-animal-rigged-animation-to-current-uc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta
          fetch-depth: 0

      - name: Bind exact Technical Art head
        shell: bash
        run: |
          set -euo pipefail
          TA_HEAD="$(git -C animal-ta rev-parse HEAD)"
          echo "TA_HEAD=${TA_HEAD}" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "${TA_HEAD}" = "${{ github.event.pull_request.head.sha }}"
          else
            test "${TA_HEAD}" = "${GITHUB_SHA}"
          fi

      - name: Checkout exact Animation owner head
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 1a8c929ce4372c4b1b1f29e9ac4cadd0cc26ac48
          path: animation

      - name: Checkout exact mirror-surface Rigging head
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 4acd9286140dd008f2a4f01ff513912497313e4f
          path: rigging

      - name: Checkout exact historical rig-plan donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor

      - name: Checkout current Universal Creation pin
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ae76436052a13e2d9214ba527c9b84e1cffc622c
          path: uc

      - name: Verify exact dependency identities and UC codec blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C animation rev-parse HEAD)" = "1a8c929ce4372c4b1b1f29e9ac4cadd0cc26ac48"
          test "$(git -C rigging rev-parse HEAD)" = "4acd9286140dd008f2a4f01ff513912497313e4f"
          test "$(git -C rig-donor rev-parse HEAD)" = "04760112deb81a8d145226fe7ee02923107c9916"
          test "$(git -C uc rev-parse HEAD)" = "ae76436052a13e2d9214ba527c9b84e1cffc622c"
          test "$(git -C uc rev-parse HEAD:capabilities/platform-hands/shared/asset-hands/rigged-gltf-codec.js)" = "b1f2e68bb6c6800af5496decc95a8044d141edc9"
          test "$(git -C animation rev-parse HEAD:tools/build_bilateral_mirror_surface_animation_godot_evidence.py)" = "12ce04b2986b89e5ffd9617015d3659d00c108da"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preserve Technical Art receiving tests
        working-directory: animal-ta
        run: |
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v

      - name: Rebuild exact Animation-owned 41-sample producer evidence
        working-directory: animation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/owner-animation" "$RUNNER_TEMP/owner-animation-payload"
          python tools/build_bilateral_mirror_surface_animation_godot_evidence.py \
            --rigging-root "$GITHUB_WORKSPACE/rigging" \
            --rig-donor-root "$GITHUB_WORKSPACE/rig-donor" \
            --rigging-head 4acd9286140dd008f2a4f01ff513912497313e4f \
            --clip "$GITHUB_WORKSPACE/animation/examples/quadruped_articulation_loop_001.json" \
            --out "$RUNNER_TEMP/owner-animation" \
            --payload-dir "$RUNNER_TEMP/owner-animation-payload"
          grep -q 'PASS_BILATERAL_EXACT_MIRROR_SURFACE_41_SAMPLE_MOTION_REBIND' \
            "$RUNNER_TEMP/owner-animation/bilateral_mirror_surface_motion_receipt.json"

      - name: Build exact skinned GLB and validate through current UC codec
        working-directory: animal-ta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/uc_rigged_animation
          python tools/build_uc_rigged_animation_bridge_evidence.py \
            --animation-evidence "$RUNNER_TEMP/owner-animation" \
            --rigging-root "$GITHUB_WORKSPACE/rigging" \
            --rig-donor-root "$GITHUB_WORKSPACE/rig-donor" \
            --uc-root "$GITHUB_WORKSPACE/uc" \
            --technical-art-head "$TA_HEAD" \
            --out evidence/uc_rigged_animation
          grep -q 'PASS_ANIMAL_EXACT_MIRROR_RIGHT_FORELIMB_SKINNED_41_KEY_GLB_TO_CURRENT_UC_CODEC' \
            evidence/uc_rigged_animation/uc_rigged_animation_transport_receipt.json
          test "$(cat evidence/uc_rigged_animation/technical-art-head.txt)" = "$TA_HEAD"
          test "$(cat evidence/uc_rigged_animation/animation-head.txt)" = "1a8c929ce4372c4b1b1f29e9ac4cadd0cc26ac48"
          test "$(cat evidence/uc_rigged_animation/rigging-head.txt)" = "4acd9286140dd008f2a4f01ff513912497313e4f"
          test "$(cat evidence/uc_rigged_animation/uc-head.txt)" = "ae76436052a13e2d9214ba527c9b84e1cffc622c"
          test "$(cat evidence/uc_rigged_animation/uc-codec-blob.txt)" = "b1f2e68bb6c6800af5496decc95a8044d141edc9"

      - name: Retain exact producer evidence beside transport evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/owner-animation/bilateral_mirror_surface_motion_receipt.json" \
             animal-ta/evidence/uc_rigged_animation/animation-owner-receipt.json
          cp "$RUNNER_TEMP/owner-animation/bilateral_mirror_surface_motion_frames.json" \
             animal-ta/evidence/uc_rigged_animation/animation-owner-frames.json

      - name: Upload exact rigged-animation transport evidence
        uses: actions/upload-artifact@v4
        with:
          name: animal-current-uc-rigged-animation-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-ta/evidence/uc_rigged_animation
          if-no-files-found: error
          retention-days: 30
