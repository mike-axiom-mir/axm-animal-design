name: Runtime Animal persistent dynamic-region evidence

on:
  pull_request:
    paths:
      - "tools/godot_runtime_direction_frame_dynamic_region_probe.gd"
      - "tools/verify_runtime_direction_frame_dynamic_region.py"
      - "tools/godot_runtime_direction_frame_dynamic_region_probe_v2.gd"
      - "tools/verify_runtime_direction_frame_dynamic_region_v2.py"
      - "tools/godot_runtime_direction_frame_dynamic_render_probe.gd"
      - "tools/verify_runtime_direction_frame_dynamic_render.py"
      - "docs/runtime_direction_frame_dynamic_region.md"
      - ".github/workflows/runtime-animal-direction-frame-dynamic-region.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-animal-direction-frame-dynamic-region:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Runtime head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-runtime
          fetch-depth: 0

      - name: Bind pass-40 Runtime lineage
        working-directory: animal-runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_HEAD="$(git rev-parse HEAD)"
          echo "RUNTIME_HEAD=$RUNTIME_HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor 9db88b7629df025be1c157c19ca258e3ff0ce483 HEAD
          test "$(git hash-object tools/godot_runtime_direction_frame_mesh_reuse_probe.gd)" = "$(git rev-parse 9db88b7629df025be1c157c19ca258e3ff0ce483:tools/godot_runtime_direction_frame_mesh_reuse_probe.gd)"

      - name: Checkout exact current Technical Art receiver owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 1ca28d29c7e1aaa095c11aaa6085716669230cb3
          path: animal-ta-current
          fetch-depth: 1

      - name: Bind exact current Technical Art identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C animal-ta-current rev-parse HEAD)" = "1ca28d29c7e1aaa095c11aaa6085716669230cb3"
          test "$(git -C animal-ta-current hash-object tools/godot_direction_frame_target_host_probe.gd)" = "2d60acf41d08054583f34fe8d5c6904860b477e7"
          test "$(git -C animal-ta-current hash-object tools/build_uc_direction_frame_target_host_adapter_evidence.py)" = "2858c9761820d27f478e1a464ecca2ef3e79d375"

      - name: Download exact current Technical Art target-host evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ta-current"
          gh api repos/mike-axiom-mir/axm-animal-design/actions/artifacts/10514887379/zip > "$RUNNER_TEMP/ta-current.zip"
          echo "50ece0d05336e85662c9b1753d0ff5c42699c96f4e1e5a310a49e320895bfa60  $RUNNER_TEMP/ta-current.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ta-current.zip" -d "$RUNNER_TEMP/ta-current"
          TA_PACKET="$(find "$RUNNER_TEMP/ta-current" -name 'technical-art-target-host-packet.json' -print -quit)"
          TA_RECEIPT="$(find "$RUNNER_TEMP/ta-current" -name 'godot-arraymesh-target-host-receipt.json' -print -quit)"
          test -n "$TA_PACKET"
          test -n "$TA_RECEIPT"
          grep -q 'PASS_TECHNICAL_ART_GODOT_ARRAYMESH_OWNER_RECONSTRUCTED_FRAME_41_KEYS_RIGHT' "$TA_RECEIPT"
          echo "TA_PACKET=$TA_PACKET" >> "$GITHUB_ENV"
          echo "TA_RECEIPT=$TA_RECEIPT" >> "$GITHUB_ENV"

      - name: Bind current UC receiver dependency continuity without modifying UC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uc-closure"
          gh api repos/mike-axiom-mir/axm-animal-design/actions/artifacts/10514528544/zip > "$RUNNER_TEMP/uc-closure.zip"
          echo "8b7d65539251f2ac3b8c35c125916438072383befeae0564565fdc1a3edf20f9  $RUNNER_TEMP/uc-closure.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/uc-closure.zip" -d "$RUNNER_TEMP/uc-closure"
          grep -R -q 'PASS_CURRENT_UC_RIGGED_RECEIVER_DEPENDENCY_CLOSURE_IDENTICAL_TO_TESTED_RECEIVER' "$RUNNER_TEMP/uc-closure"
          grep -R -q '452b179cccff8acdde8930f7bde8662e52f86949' "$RUNNER_TEMP/uc-closure"

      - name: Preserve both failed dynamic-region predecessors exactly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/mike-axiom-mir/axm-animal-design/actions/artifacts/10516719596/zip > "$RUNNER_TEMP/failed-v1.zip"
          echo "a00a9af5192bc7c923e1f4a1891faa7880a3c47eec263d82c1e04e664eaf7413  $RUNNER_TEMP/failed-v1.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/failed-v1"
          unzip -q "$RUNNER_TEMP/failed-v1.zip" -d "$RUNNER_TEMP/failed-v1"
          grep -q 'HOLD_ANIMAL_GODOT_DYNAMIC_VERTEX_DIRECTION_REGION_UPDATE' "$RUNNER_TEMP/failed-v1/runtime-dynamic-region-result.json"
          gh api repos/mike-axiom-mir/axm-animal-design/actions/artifacts/10518260489/zip > "$RUNNER_TEMP/failed-v2.zip"
          echo "3c2c5ae33fc0706994aff24fbb491e54d175fe0826411fae6136dd8a8735a83c  $RUNNER_TEMP/failed-v2.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/failed-v2"
          unzip -q "$RUNNER_TEMP/failed-v2.zip" -d "$RUNNER_TEMP/failed-v2"
          grep -q 'HOLD_ANIMAL_GODOT_ENGINE_PACKED_VERTEX_REGION_UPDATE' "$RUNNER_TEMP/failed-v2/runtime-engine-packed-region-result.json"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Runtime verifier
        working-directory: animal-runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/verify_runtime_direction_frame_dynamic_render.py

      - name: Setup exact Godot proof host
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Re-prove current Technical Art target-host packet first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p animal-runtime/evidence/runtime-animal-direction-frame-dynamic-render-001
          godot --headless \
            --script animal-ta-current/tools/godot_direction_frame_target_host_probe.gd -- \
            --payload "$TA_PACKET" \
            --out "$GITHUB_WORKSPACE/animal-runtime/evidence/runtime-animal-direction-frame-dynamic-render-001/current-ta-baseline-receipt.json"
          grep -q 'PASS_TECHNICAL_ART_GODOT_ARRAYMESH_OWNER_RECONSTRUCTED_FRAME_41_KEYS_RIGHT' \
            animal-runtime/evidence/runtime-animal-direction-frame-dynamic-render-001/current-ta-baseline-receipt.json

      - name: Measure persistent vertex buffer through rendered target-host evidence
        working-directory: animal-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime-animal-direction-frame-dynamic-render-001/images
          xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy \
            --script tools/godot_runtime_direction_frame_dynamic_render_probe.gd -- \
            --payload "$TA_PACKET" \
            --out "$(pwd)/evidence/runtime-animal-direction-frame-dynamic-render-001/runtime-dynamic-render-result.json" \
            --image-dir "$(pwd)/evidence/runtime-animal-direction-frame-dynamic-render-001/images"
          python tools/verify_runtime_direction_frame_dynamic_render.py \
            evidence/runtime-animal-direction-frame-dynamic-render-001/runtime-dynamic-render-result.json

      - name: Fail closed if rendered identity is weakened
        working-directory: animal-runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('evidence/runtime-animal-direction-frame-dynamic-render-001/runtime-dynamic-render-result.json')
          mutated = json.loads(source.read_text(encoding='utf-8'))
          mutated['render_equivalence']['byte_identical_pairs'] = 40
          mutated['render_equivalence']['total_changed_pixels'] = 1
          out = Path('/tmp/runtime-dynamic-render-mutated.json')
          out.write_text(json.dumps(mutated, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          if python tools/verify_runtime_direction_frame_dynamic_render.py /tmp/runtime-dynamic-render-mutated.json; then
            echo 'mutated render identity unexpectedly passed' >&2
            exit 1
          fi

      - name: Retain exact identities metrics and truth boundary
        working-directory: animal-runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=evidence/runtime-animal-direction-frame-dynamic-render-001
          printf '%s\n' "$RUNTIME_HEAD" > "$ROOT/exact-runtime-head.txt"
          printf '%s\n' '9db88b7629df025be1c157c19ca258e3ff0ce483' > "$ROOT/pass40-runtime-head.txt"
          printf '%s\n' '1ca28d29c7e1aaa095c11aaa6085716669230cb3' > "$ROOT/exact-current-technical-art-head.txt"
          printf '%s\n' '35261179299' > "$ROOT/exact-current-technical-art-target-host-workflow.txt"
          printf '%s\n' '10514887379' > "$ROOT/exact-current-technical-art-target-host-artifact.txt"
          printf '%s\n' '50ece0d05336e85662c9b1753d0ff5c42699c96f4e1e5a310a49e320895bfa60' > "$ROOT/exact-current-technical-art-target-host-artifact-sha256.txt"
          printf '%s\n' '35261179289' > "$ROOT/exact-current-uc-dependency-closure-workflow.txt"
          printf '%s\n' '10514528544' > "$ROOT/exact-current-uc-dependency-closure-artifact.txt"
          printf '%s\n' '8b7d65539251f2ac3b8c35c125916438072383befeae0564565fdc1a3edf20f9' > "$ROOT/exact-current-uc-dependency-closure-artifact-sha256.txt"
          printf '%s\n' '452b179cccff8acdde8930f7bde8662e52f86949' > "$ROOT/current-uc-head-proven-by-closure.txt"
          printf '%s\n' 'fbc9c8a86daa299c6a3bf2b9aa421cf30b01df41' > "$ROOT/failed-v1-runtime-head.txt"
          printf '%s\n' '35267861278' > "$ROOT/failed-v1-workflow.txt"
          printf '%s\n' '10516719596' > "$ROOT/failed-v1-artifact.txt"
          printf '%s\n' 'a00a9af5192bc7c923e1f4a1891faa7880a3c47eec263d82c1e04e664eaf7413' > "$ROOT/failed-v1-artifact-sha256.txt"
          printf '%s\n' '79c3fead177996e7b825885701c877c81a1f46c7' > "$ROOT/failed-v2-runtime-head.txt"
          printf '%s\n' '35268361181' > "$ROOT/failed-v2-workflow.txt"
          printf '%s\n' '10518260489' > "$ROOT/failed-v2-artifact.txt"
          printf '%s\n' '3c2c5ae33fc0706994aff24fbb491e54d175fe0826411fae6136dd8a8735a83c' > "$ROOT/failed-v2-artifact-sha256.txt"
          cp "$TA_RECEIPT" "$ROOT/exact-current-technical-art-target-host-receipt.json"
          cp "$TA_PACKET" "$ROOT/exact-current-technical-art-target-host-packet.json"
          cp "$RUNNER_TEMP/failed-v1/runtime-dynamic-region-result.json" "$ROOT/failed-v1-result.json"
          cp "$RUNNER_TEMP/failed-v2/runtime-engine-packed-region-result.json" "$ROOT/failed-v2-result.json"
          cp -R "$RUNNER_TEMP/uc-closure" "$ROOT/current-uc-receiver-dependency-closure"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/runtime-animal-direction-frame-dynamic-render-001')
          result = json.loads((root / 'runtime-dynamic-render-result.json').read_text(encoding='utf-8'))
          summary = {
              'state': result['state'],
              'surface_rebuilds_before': result['before']['surface_rebuilds_per_41_key_playback'],
              'surface_rebuilds_after': result['after']['surface_rebuilds_per_41_key_playback'],
              'surface_rebuild_reduction_percent': result['after']['surface_rebuild_reduction_percent'],
              'surface_construction_reduction_percent': result['after']['surface_construction_reduction_percent'],
              'vertex_region_updates_per_playback': result['after']['vertex_region_updates_per_playback'],
              'cached_raw_vertex_bytes': result['engine_packed_vertex_cache']['cached_raw_vertex_bytes_all_41_keys'],
              'render_pairs': result['render_equivalence']['render_pairs'],
              'byte_identical_pairs': result['render_equivalence']['byte_identical_pairs'],
              'changed_pixels': result['render_equivalence']['total_changed_pixels'],
              'observer_sensitivity_changed_pixels': result['render_equivalence']['observer_sensitivity_key0_vs_key20_changed_pixels'],
              'baseline_median_sweep_us': result['proof_host_timing']['baseline_median_sweep_us'],
              'candidate_median_sweep_us': result['proof_host_timing']['candidate_median_sweep_us'],
              'median_delta_percent': result['proof_host_timing']['median_delta_percent'],
              'baseline_p95_sweep_us': result['proof_host_timing']['baseline_p95_sweep_us'],
              'candidate_p95_sweep_us': result['proof_host_timing']['candidate_p95_sweep_us'],
              'p95_delta_percent': result['proof_host_timing']['p95_delta_percent'],
              'envelope_vs_median_frame_volume_ratio': result['motion_envelope']['envelope_vs_median_frame_volume_ratio'],
              'visual_tradeoff': result['visual_tradeoff'],
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cat > "$ROOT/README.txt" <<'EOF'
          Runtime / Optimization bounded Animal persistent vertex-buffer evidence.
          Pass 40 already proved one persistent ArrayMesh but still rebuilt the complete surface for each of 41 authored keys. This pass keeps one dynamic surface and updates only Godot's own engine-packed vertex_data once per key; UV and index buffers remain untouched.
          Two failed predecessors are preserved. Their correctness gate depended on ArrayMesh.surface_get_arrays after surface_update_vertex_region, but that getter retains the original CPU-side surface metadata. This final proof therefore uses a render observer that directly exercises POSITION, NORMAL and TANGENT through the target renderer, with an observer-sensitivity control, while the unchanged surface-rebuild path remains the visual baseline.
          Proof-host submission timing excludes payload preparation and is not target-device evidence. A conservative all-motion custom AABB is required; it prevents stale-culling disappearance but increases the culling volume versus the median authored key.
          Fresh production shading, bilateral receiving, continuous/interpolated playback, target-device CPU/GPU/FPS/VRAM/thermal/battery, Art Direction acceptance, independent Visual QA acceptance, CANON and production readiness remain HOLD.
          EOF

      - name: Upload exact Runtime dynamic-render evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-runtime-direction-frame-dynamic-render-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal-runtime/evidence/runtime-animal-direction-frame-dynamic-render-001
          if-no-files-found: warn
          retention-days: 30
