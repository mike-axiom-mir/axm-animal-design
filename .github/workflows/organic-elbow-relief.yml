name: Organic elbow bend-plane relief evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  organic-elbow-relief:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Organic review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
      - name: Checkout exact existing Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite with exact donor
        working-directory: animal
        env:
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
        run: python -m unittest discover -s tests -v
      - name: Build exact Organic form evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          python tools/build_organic_elbow_relief_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --rig-donor-head 04760112deb81a8d145226fe7ee02923107c9916 \
            --out evidence/organic-elbow-relief-001
          python tools/build_organic_elbow_relief_perspective_review.py \
            --evidence-dir evidence/organic-elbow-relief-001
          test -s evidence/organic-elbow-relief-001/perspective-review-receipt.json
          test -s evidence/organic-elbow-relief-001/baseline-vs-elbow-relief-perspective-outer-three-quarter.svg
          test -s evidence/organic-elbow-relief-001/baseline-vs-elbow-relief-perspective-bend-profile.svg
          grep -q 'PASS_LOCKED_CAMERA_PERSPECTIVE_REVIEW_EVIDENCE' \
            evidence/organic-elbow-relief-001/perspective-review-receipt.json
          git rev-parse HEAD > evidence/organic-elbow-relief-001/exact-head.txt
          printf '%s\n' 'f4614ab2f691cd5c5d12b88fabc38ef848acd24e' > evidence/organic-elbow-relief-001/rigging-pr6-base-head.txt
          printf '%s\n' '04760112deb81a8d145226fe7ee02923107c9916' > evidence/organic-elbow-relief-001/rig-donor-head.txt
      - name: Upload exact evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-organic-elbow-relief-001-evidence
          path: animal/evidence/organic-elbow-relief-001
          if-no-files-found: error
          retention-days: 30
