name: Connected forelimb deformation evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  deformation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout connected Geometry candidate + Rigging probe
        uses: actions/checkout@v4
        with:
          path: animal
      - name: Checkout exact existing Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite
        working-directory: animal
        run: python -m unittest discover -s tests -v
      - name: Build exact connected deformation evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          python tools/build_connected_deformation_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --rig-donor-head 04760112deb81a8d145226fe7ee02923107c9916 \
            --out evidence/rigging-connected-forelimb-001
          git rev-parse HEAD > evidence/rigging-connected-forelimb-001/exact-head.txt
          printf '%s\n' 'feb4b24cd36bcc879173138d240754f71db34834' > evidence/rigging-connected-forelimb-001/geometry-pr4-head.txt
          printf '%s\n' '04760112deb81a8d145226fe7ee02923107c9916' > evidence/rigging-connected-forelimb-001/rig-donor-head.txt
      - name: Upload exact evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: front-left-connected-chain-001-deformation-evidence
          path: animal/evidence/rigging-connected-forelimb-001
          if-no-files-found: error
          retention-days: 30
