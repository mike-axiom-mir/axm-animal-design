name: Organic bilateral elbow source successor evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  organic-bilateral-elbow-source-successor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Organic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
      - name: Checkout exact historical Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - name: Checkout exact source-successor Rigging prerequisite
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: b48bb957622ed5c82a24ca4fcb471f7ee9b5147a
          path: rigging-successor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact Rigging prerequisite checkout
        run: test "$(git -C rigging-successor rev-parse HEAD)" = "b48bb957622ed5c82a24ca4fcb471f7ee9b5147a"
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite with exact Rigging donor
        working-directory: animal
        env:
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
        run: python -m unittest discover -s tests -v
      - name: Build exact bilateral source-propagation evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/organic-elbow-bilateral-source-successor-003
          python tools/build_organic_elbow_bilateral_successor_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --rigging-successor-head b48bb957622ed5c82a24ca4fcb471f7ee9b5147a \
            --out evidence/organic-elbow-bilateral-source-successor-003

          test -s evidence/organic-elbow-bilateral-source-successor-003/bilateral-source-propagation-receipt.json
          test -s evidence/organic-elbow-bilateral-source-successor-003/right-source-successor.json
          test -s evidence/organic-elbow-bilateral-source-successor-003/bilateral-mirror-structural-overlay.svg
          grep -q 'PASS_BILATERAL_SOURCE_PROPAGATION_EXACT_MIRROR' \
            evidence/organic-elbow-bilateral-source-successor-003/bilateral-source-propagation-receipt.json
          grep -q 'RIGHT_SOURCE_OWNED_SUCCESSOR_NOT_CANON__GEOMETRY_RIGGING_VISUAL_HELD' \
            evidence/organic-elbow-bilateral-source-successor-003/bilateral-source-propagation-receipt.json
          git rev-parse HEAD > evidence/organic-elbow-bilateral-source-successor-003/exact-head.txt
          printf '%s\n' 'b48bb957622ed5c82a24ca4fcb471f7ee9b5147a' > evidence/organic-elbow-bilateral-source-successor-003/rigging-successor-head.txt
      - name: Upload exact bilateral source-propagation evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-organic-elbow-bilateral-source-successor-003-evidence
          path: animal/evidence/organic-elbow-bilateral-source-successor-003
          if-no-files-found: error
          retention-days: 30
