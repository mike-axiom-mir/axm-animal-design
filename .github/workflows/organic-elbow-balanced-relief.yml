name: Organic balanced elbow relief evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  organic-balanced-elbow-relief:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Organic review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
      - name: Checkout exact Rigging plan/profile donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - name: Checkout exact connected Rigging weighting donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 5625c9f796a75e8b441458c51093e55519490611
          path: connected-rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: animal
        run: python -m compileall -q src tests tools
      - name: Run full animal-design unit suite with exact donor
        working-directory: animal
        env:
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
        run: python -m unittest discover -s tests -v
      - name: Build exact balanced Organic evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidence/organic-elbow-balanced-relief-002/connected-rigging-donor
          PYTHONPATH=../connected-rig-donor/src python ../connected-rig-donor/tools/build_connected_weighting_refinement_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --rig-donor-head 04760112deb81a8d145226fe7ee02923107c9916 \
            --out evidence/organic-elbow-balanced-relief-002/connected-rigging-donor

          python tools/build_organic_elbow_balanced_relief_evidence.py \
            --source examples/quadruped_neutral_001.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --donor-receipt evidence/organic-elbow-balanced-relief-002/connected-rigging-donor/connected-weighting-refinement-receipt.json \
            --rig-donor-head 04760112deb81a8d145226fe7ee02923107c9916 \
            --connected-rigging-head 5625c9f796a75e8b441458c51093e55519490611 \
            --out evidence/organic-elbow-balanced-relief-002

          test -s evidence/organic-elbow-balanced-relief-002/balanced-elbow-relief-receipt.json
          test -s evidence/organic-elbow-balanced-relief-002/balanced-elbow-relief-perspective-outer-three-quarter.svg
          test -s evidence/organic-elbow-balanced-relief-002/balanced-elbow-relief-perspective-bend-profile.svg
          grep -q 'PASS_BALANCED_ELBOW_RELIEF_REMOVES_MIN_AREA_TRADEOFF_ACROSS_PINNED_WEIGHTINGS' \
            evidence/organic-elbow-balanced-relief-002/balanced-elbow-relief-receipt.json
          grep -q 'HOLD_VISUAL_AND_SOURCE_ADOPTION' \
            evidence/organic-elbow-balanced-relief-002/balanced-elbow-relief-receipt.json
          git rev-parse HEAD > evidence/organic-elbow-balanced-relief-002/exact-head.txt
          printf '%s\n' '04760112deb81a8d145226fe7ee02923107c9916' > evidence/organic-elbow-balanced-relief-002/rig-donor-head.txt
          printf '%s\n' '5625c9f796a75e8b441458c51093e55519490611' > evidence/organic-elbow-balanced-relief-002/connected-rigging-head.txt
      - name: Upload exact balanced Organic evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-organic-elbow-balanced-relief-002-evidence
          path: animal/evidence/organic-elbow-balanced-relief-002
          if-no-files-found: error
          retention-days: 30
