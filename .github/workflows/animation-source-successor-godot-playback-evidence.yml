name: Animation source-successor Godot playback evidence

on:
  push:
    branches:
      - studio/animation-quadruped-articulation-loop-001
    paths:
      - "tools/build_source_successor_animation_rebind_evidence.py"
      - "tools/build_source_successor_animation_godot_playback.py"
      - "tools/godot_animation_playback/**"
      - "examples/quadruped_articulation_loop_001.json"
      - ".github/workflows/animation-source-successor-godot-playback-evidence.yml"
  pull_request:
    paths:
      - "tools/build_source_successor_animation_rebind_evidence.py"
      - "tools/build_source_successor_animation_godot_playback.py"
      - "tools/godot_animation_playback/**"
      - "examples/quadruped_articulation_loop_001.json"
      - ".github/workflows/animation-source-successor-godot-playback-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-successor-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact Animation lane head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: animal

      - name: Bind evidence to exact Animation lineage
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXACT_HEAD_SHA=${EXACT_HEAD_SHA}" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "${EXACT_HEAD_SHA}" = "${{ github.event.pull_request.head.sha }}"
          else
            test "${EXACT_HEAD_SHA}" = "${GITHUB_SHA}"
          fi
          git merge-base --is-ancestor b10ec5aeeb02b5df8d42e13df2772f4dcaae9a3a HEAD

      - name: Check out exact source-successor Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: b48bb957622ed5c82a24ca4fcb471f7ee9b5147a
          path: successor-donor

      - name: Check out exact historical rig/profile donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preserve receiving repository gates
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v

      - name: Reject successor donor identity drift
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          if python tools/build_source_successor_animation_rebind_evidence.py \
            --source ../successor-donor/examples/quadruped_neutral_001.json \
            --source-profile ../successor-donor/examples/quadruped_elbow_source_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --clip examples/quadruped_articulation_loop_001.json \
            --successor-donor-root ../successor-donor \
            --successor-donor-head 0000000000000000000000000000000000000000 \
            --out evidence/negative-source-successor-motion; then
            echo "wrong successor donor identity unexpectedly passed"
            exit 1
          fi
          rm -rf evidence/negative-source-successor-motion

      - name: Reject silent refined-weighting adoption
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('examples/quadruped_articulation_loop_001.json')
          dst = Path('/tmp/quadruped_articulation_loop_refined_weighting.json')
          payload = json.loads(src.read_text())
          payload['rig_weighting_profile'] = 'ease-out-power-0p75-v1'
          dst.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          if python tools/build_source_successor_animation_rebind_evidence.py \
            --source ../successor-donor/examples/quadruped_neutral_001.json \
            --source-profile ../successor-donor/examples/quadruped_elbow_source_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --clip /tmp/quadruped_articulation_loop_refined_weighting.json \
            --successor-donor-root ../successor-donor \
            --successor-donor-head b48bb957622ed5c82a24ca4fcb471f7ee9b5147a \
            --out evidence/negative-refined-weighting-motion; then
            echo "silent refined weighting adoption unexpectedly passed"
            exit 1
          fi
          rm -rf evidence/negative-refined-weighting-motion

      - name: Rebind unchanged 41-sample clip to exact source successor
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/animation-source-successor-motion-001
          python tools/build_source_successor_animation_rebind_evidence.py \
            --source ../successor-donor/examples/quadruped_neutral_001.json \
            --source-profile ../successor-donor/examples/quadruped_elbow_source_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --clip examples/quadruped_articulation_loop_001.json \
            --successor-donor-root ../successor-donor \
            --successor-donor-head b48bb957622ed5c82a24ca4fcb471f7ee9b5147a \
            --out evidence/animation-source-successor-motion-001
          printf '%s\n' "$EXACT_HEAD_SHA" > evidence/animation-source-successor-motion-001/exact-head.txt
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/animation-source-successor-motion-001')
          receipt = json.loads((root / 'source_successor_motion_receipt.json').read_text())
          frames = json.loads((root / 'source_successor_motion_frames.json').read_text())
          assert receipt['gate'] == 'PASS_SOURCE_SUCCESSOR_41_SAMPLE_MOTION_REBIND', receipt
          assert receipt['source_identity']['source_successor_candidate_digest'] == 'ace2366d8cd14c00df670b5fe1f0780ab2d01992482455ad5f7c4c9cadffeeba', receipt
          assert receipt['successor_rigging_donor']['git_head'] == 'b48bb957622ed5c82a24ca4fcb471f7ee9b5147a', receipt
          assert receipt['successor_rigging_donor']['refined_weighting_adopted_by_animation'] is False, receipt
          assert receipt['motion']['motion_changed'] is False, receipt
          assert receipt['motion']['retimed'] is False, receipt
          assert receipt['motion']['weighting_changed'] is False, receipt
          assert receipt['observed']['maximum_nonadjacent_self_intersection_pairs'] == 0, receipt
          assert receipt['observed']['maximum_collapsed_triangles'] == 0, receipt
          assert receipt['observed']['exact_neutral_start_return'] is True, receipt
          assert receipt['observed']['wrap_step_residual_m'] <= 1e-12, receipt
          assert len(frames['frames']) == 41, frames
          assert len(frames['indices']) == 240, frames
          assert frames['frames'][0]['positions'] == frames['frames'][40]['positions'], frames
          assert root.joinpath('source_successor_motion_strip.svg').stat().st_size > 1000
          print(json.dumps(receipt, indent=2))
          PY

      - name: Build exact source-successor Godot payload
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/godot_animation_playback/generated
          python tools/build_source_successor_animation_godot_playback.py \
            --motion-evidence-dir evidence/animation-source-successor-motion-001
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('tools/godot_animation_playback/generated')
          payload_path = root / 'quadruped_animation_payload.json'
          payload = json.loads(payload_path.read_text())
          summary = json.loads((root / 'quadruped_animation_payload_summary.json').read_text())
          assert summary['gate'] == 'PASS_SOURCE_SUCCESSOR_GODOT_DISCRETE_PLAYBACK_PAYLOAD_BUILD', summary
          assert summary['payload_sha256'] == hashlib.sha256(payload_path.read_bytes()).hexdigest(), summary
          assert summary['receiving_repository']['git_head'] == os.environ['EXACT_HEAD_SHA'], summary
          assert payload['source_playback']['source_gate'] == 'PASS_SOURCE_SUCCESSOR_41_SAMPLE_MOTION_REBIND', payload
          assert payload['source_playback']['playback_mode'] == 'DISCRETE_AUTHORED_SAMPLES_NO_INTERPOLATION', payload
          assert payload['topology']['candidate_digest'] == 'ace2366d8cd14c00df670b5fe1f0780ab2d01992482455ad5f7c4c9cadffeeba', payload
          assert payload['source_identity']['rig_weighting_profile'] == 'smoothstep-v0', payload
          assert summary['unique_authored_surface_digests'] > 2, summary
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise two exact source-successor cycles in Godot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path animal/tools/godot_animation_playback \
            --script observe.gd

      - name: Validate exact source-successor target-host boundary
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('tools/godot_animation_playback/generated')
          receipt = json.loads((root / 'quadruped_animation_godot_receipt.json').read_text())
          summary = json.loads((root / 'quadruped_animation_payload_summary.json').read_text())
          payload_path = root / 'quadruped_animation_payload.json'
          assert receipt['state'] == 'PASS_GODOT_DISCRETE_SAMPLE_PLAYBACK_PROOF_HOST', receipt
          assert receipt['promotion_effect'] == 'NONE', receipt
          assert summary['receiving_repository']['git_head'] == os.environ['EXACT_HEAD_SHA'], summary
          assert receipt['payload_sha256'] == hashlib.sha256(payload_path.read_bytes()).hexdigest(), receipt
          assert receipt['payload_sha256'] == summary['payload_sha256'], (receipt, summary)
          assert receipt['source_identity'] == summary['source_identity'], (receipt, summary)
          assert receipt['source_playback']['source_gate'] == 'PASS_SOURCE_SUCCESSOR_41_SAMPLE_MOTION_REBIND', receipt
          assert receipt['topology']['candidate_digest'] == 'ace2366d8cd14c00df670b5fe1f0780ab2d01992482455ad5f7c4c9cadffeeba', receipt
          applied = receipt['engine_sample_application']
          assert applied['applied_sample_steps'] == 81, applied
          assert applied['cycles_exercised'] == 2, applied
          assert applied['final_wrap_sample'] == 0, applied
          assert applied['sequence_order_ok'] is True, applied
          assert applied['readback_matches_payload'] is True, applied
          assert applied['maximum_vertex_readback_error_m'] <= 1e-6, applied
          assert applied['real_time_frame_pacing_claimed'] is False, applied
          assert applied['interpolation_claimed'] is False, applied
          visual = receipt['visual_observation']
          assert visual['peak_visible'] is True, visual
          assert visual['neutral_roundtrip_visually_clean'] is True, visual
          assert visual['visual_quality_acceptance'] == 'NOT_CLAIMED', visual
          for name in ('godot-neutral.png', 'godot-peak.png', 'godot-last-visible.png', 'godot-wrap-neutral.png'):
              assert root.joinpath(name).stat().st_size > 1000, name
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload exact source-successor Animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-source-successor-animation-godot-${{ env.EXACT_HEAD_SHA }}
          path: |
            animal/evidence/animation-source-successor-motion-001/source_successor_motion_receipt.json
            animal/evidence/animation-source-successor-motion-001/source_successor_motion_frames.json
            animal/evidence/animation-source-successor-motion-001/source_successor_motion_strip.svg
            animal/evidence/animation-source-successor-motion-001/exact-head.txt
            animal/tools/godot_animation_playback/generated/quadruped_animation_payload.json
            animal/tools/godot_animation_playback/generated/quadruped_animation_payload_summary.json
            animal/tools/godot_animation_playback/generated/quadruped_animation_godot_receipt.json
            animal/tools/godot_animation_playback/generated/godot-neutral.png
            animal/tools/godot_animation_playback/generated/godot-peak.png
            animal/tools/godot_animation_playback/generated/godot-last-visible.png
            animal/tools/godot_animation_playback/generated/godot-wrap-neutral.png
          if-no-files-found: error
          retention-days: 30

  python-313-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact Animation lane head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
      - name: Check out exact source-successor Rigging donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: b48bb957622ed5c82a24ca4fcb471f7ee9b5147a
          path: successor-donor
      - name: Check out exact historical rig/profile donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile, test and reproduce structural rebind on Python 3.13
        working-directory: animal
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          rm -rf evidence/animation-source-successor-motion-001
          python tools/build_source_successor_animation_rebind_evidence.py \
            --source ../successor-donor/examples/quadruped_neutral_001.json \
            --source-profile ../successor-donor/examples/quadruped_elbow_source_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --clip examples/quadruped_articulation_loop_001.json \
            --successor-donor-root ../successor-donor \
            --successor-donor-head b48bb957622ed5c82a24ca4fcb471f7ee9b5147a \
            --out evidence/animation-source-successor-motion-001
          grep -q 'PASS_SOURCE_SUCCESSOR_41_SAMPLE_MOTION_REBIND' \
            evidence/animation-source-successor-motion-001/source_successor_motion_receipt.json
