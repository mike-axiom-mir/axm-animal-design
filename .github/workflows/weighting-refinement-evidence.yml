name: Weighting refinement evidence

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exact weighting refinement evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_weighting_refinement.py
      - name: Upload exact weighting refinement evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-weighting-refinement-001-evidence
          path: evidence/weighting-refinement-001/
          if-no-files-found: error
