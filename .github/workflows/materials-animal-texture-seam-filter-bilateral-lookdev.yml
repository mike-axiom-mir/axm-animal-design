name: Materials Animal bilateral texture seam filter lookdev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materials-animal-bilateral-texture-seam-filter-lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: animal
          fetch-depth: 0

      - name: Bind prior Materials seam-filter proof and exact owner inputs
        working-directory: animal
        run: |
          git merge-base --is-ancestor edec05e2e803dd3c7483e374c12eb1fa5a9c5501 HEAD
          git merge-base --is-ancestor 63c65d57fda0595217f86d971ff8c67f256188be HEAD
          git merge-base --is-ancestor ca4bb8a2f144231f8755eacc980785d1807b79db HEAD
          test "$(git hash-object tools/build_animal_tangent_space_lookdev_payload.py)" = "cdc97ebcee6fccf122c64d71d9ab087a3919ac4c"
          test "$(git hash-object src/axm_animal_design/bilateral_deformed_tangent_frames.py)" = "fbade964b3305d70775d196232ad2cd4671d0eac"
          test "$(git hash-object src/axm_animal_design/bilateral_uv_tangent_basis.py)" = "ba0b4e620f132413606177358e47bd32ae4d4965"
          test "$(git hash-object evidence/godot_animal_texture_seam_filter_lookdev/render_review.gd)" = "5b7067ee1dbd1fd8f3b8c396cea9812d85c44887"

      - name: Checkout exact Rigging plan and weighting-profile donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-animal-design
          ref: 04760112deb81a8d145226fe7ee02923107c9916
          path: rig-donor
          fetch-depth: 1

      - name: Verify exact Rigging plan donor
        run: test "$(git -C rig-donor rev-parse HEAD)" = "04760112deb81a8d145226fe7ee02923107c9916"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Materials additions
        working-directory: animal
        run: python -m compileall -q src tests tools

      - name: Run inherited Animal suite
        working-directory: animal
        env:
          PYTHONPATH: src
          AXM_RIG_PLAN: ../rig-donor/examples/quadruped_rig_probe_001.json
          AXM_WEIGHTING_PROFILE: ../rig-donor/examples/quadruped_weighting_refinement_001.json
        run: python -m unittest discover -s tests -v

      - name: Install image verifier dependency
        if: matrix.python-version == '3.11'
        run: python -m pip install --disable-pip-version-check pillow

      - name: Setup Godot target host
        if: matrix.python-version == '3.11'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Build exact bilateral tangent-space payload
        if: matrix.python-version == '3.11'
        working-directory: animal
        env:
          PYTHONPATH: src
        run: |
          rm -rf evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001
          mkdir -p evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/renders
          python tools/build_animal_tangent_space_lookdev_payload.py \
            --source examples/quadruped_neutral_001.json \
            --left-profile examples/quadruped_elbow_source_successor_003.json \
            --bilateral-profile examples/quadruped_elbow_bilateral_successor_003.json \
            --rig-plan ../rig-donor/examples/quadruped_rig_probe_001.json \
            --weighting-profile ../rig-donor/examples/quadruped_weighting_refinement_001.json \
            --rigging-tangent-head 63c65d57fda0595217f86d971ff8c67f256188be \
            --rigging-tangent-module-blob fbade964b3305d70775d196232ad2cd4671d0eac \
            --geometry-head ca4bb8a2f144231f8755eacc980785d1807b79db \
            --geometry-module-blob ba0b4e620f132413606177358e47bd32ae4d4965 \
            --out evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/review-payload.json

      - name: Validate Godot texture-seam lookdev project
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: godot --headless --path evidence/godot_animal_texture_seam_filter_lookdev --editor --quit

      - name: Capture exact bilateral target-host texture seam/filter A/B
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: |
          set -euo pipefail
          timeout 420s xvfb-run --auto-servernum --server-args="-screen 0 960x720x24" \
            godot \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path evidence/godot_animal_texture_seam_filter_lookdev \
            res://bilateral_main.tscn -- \
            --payload "$(pwd)/evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/review-payload.json" \
            --out-dir "$(pwd)/evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/renders"

      - name: Verify and summarize bilateral texture seam/filter evidence
        if: matrix.python-version == '3.11'
        working-directory: animal
        run: |
          python tools/verify_animal_texture_seam_filter_bilateral_lookdev.py \
            --payload evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/review-payload.json \
            --telemetry evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/target-host-telemetry.json \
            --renders evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/renders \
            --materials-head "$(git rev-parse HEAD)" \
            --predecessor-materials-head edec05e2e803dd3c7483e374c12eb1fa5a9c5501 \
            --out evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/materials-texture-seam-filter-bilateral-evidence.json
          grep -q 'PASS_ANIMAL_BILATERAL_PERIODIC_NORMAL_TEXTURE_SEAM_FILTER_LOCALIZATION' \
            evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/materials-texture-seam-filter-bilateral-evidence.json
          git rev-parse HEAD > evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/exact-materials-head.txt
          printf '%s\n' 'edec05e2e803dd3c7483e374c12eb1fa5a9c5501' > evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/predecessor-materials-head.txt
          printf '%s\n' '63c65d57fda0595217f86d971ff8c67f256188be' > evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/exact-rigging-tangent-head.txt
          printf '%s\n' 'ca4bb8a2f144231f8755eacc980785d1807b79db' > evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/exact-geometry-uv-tangent-head.txt
          cat > evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001/README.txt <<'EOF'
          Materials / LookDev bilateral texture-seam receiving evidence only.
          This reuses the exact Geometry PR #20 seam-aware UV/tangent domain and Rigging PR #22 representative deformed tangent frames on both left and right sides, both retained weighting identities, five representative angles and two cameras. The material, lighting, cameras and self-generated 256x256 periodic normal texture remain frozen from the preceding right-side seam/filter proof.
          A deliberate first/last-eight-column U-edge mutation remains the localized negative. The prior right-side Technical-Art/reconstructed-frame proof at Materials head edec05e2 remains historical evidence and is not relabelled as bilateral Technical-Art transport.
          This does not establish a production Animal normal map, final UV packing/padding/texel density, all-level mip wrap perfection, Technical-Art import/transport, continuous playback quality, Runtime/device adoption, final Art/QA acceptance, CANON or production readiness.
          EOF

      - name: Upload exact Materials bilateral texture seam/filter evidence
        if: ${{ always() && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-materials-texture-seam-filter-bilateral-lookdev-${{ github.event.pull_request.head.sha || github.sha }}
          path: animal/evidence/materials-animal-texture-seam-filter-bilateral-lookdev-001
          if-no-files-found: error
          retention-days: 30
